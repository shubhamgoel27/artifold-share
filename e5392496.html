*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {

  overflow-y: auto;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;

}
#sidebar .logo {

  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);

}
#sidebar .logo span { font-weight: 400; color: var(--text-muted); font-size: 11px; display: block; margin-top: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  user-select: none;
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item.active { background: var(--bg-hover); color: var(--text-primary); }
.nav-item .badge {

#main {

  padding: 28px 32px 60px;
  background: var(--bg-deep);
}
.breadcrumb {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.breadcrumb a { color: var(--text-secondary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--text-primary); }
.breadcrumb .sep { margin: 0 6px; }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
h1 + .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--bg-surface);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.stat-card .value { font-size: 28px; font-weight: 700; font-family: 'Inter', monospace; }
.stat-card .detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.card {
  background: var(--bg-surface);
  border-radius: 10px;
  padding: 18px;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  position: relative;
  overflow: hidden;
}
.card:hover { background: var(--bg-hover); transform: translateY(-2px); }
.card .accent-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.card .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; margin-top: 4px; }
.card .card-meta { font-size: 12px; color: var(--text-muted); }
.card .card-meta strong { color: var(--text-secondary); font-family: monospace; }
.card .sparkline-wrap { margin-top: 10px; height: 30px; }
.tab-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  transition: all 0.15s;
}
.tab-btn:hover { background: var(--bg-hover); }

.filter-row { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-row label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.filter-row label:first-child { margin-left: 0; }
.pain-badge { display: inline-block; background: rgba(239,68,68,0.2); color: #ef4444; font-size: 11px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; font-weight: 600; }
.dom-badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 500; }
.dom-badge.dom-chest { background: rgba(249,115,22,0.15); color: #f97316; }
.dom-badge.dom-delt { background: rgba(234,179,8,0.15); color: #eab308; }
.dom-badge.dom-back { background: rgba(6,182,212,0.15); color: #06b6d4; }
.dom-badge.dom-mixed { background: rgba(168,162,158,0.15); color: #a8a29e; }
.context-legend { font-size: 12px; color: var(--text-muted); margin: 8px 0 16px; display: flex; align-items: center; gap: 6px; }
.pain-dot { display: inline-block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
.filter-row select {
  background: var(--bg-hover);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-primary);
  font-size: 13px;
  padding: 5px 10px;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 16px;
}
.data-table th {
  text-align: left;
  padding: 8px 10px;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.data-table td {
  padding: 7px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--text-secondary);
  font-family: monospace;
  font-size: 12px;

.data-table tr:hover td { background: rgba(255,255,255,0.02); }

  gap: 4px;
  margin-bottom: 28px;
  flex-wrap: wrap;

.meso-bar {

  border-radius: 5px;

.heatmap-labels { display: flex; gap: 2px; margin-bottom: 4px; font-size: 10px; color: var(--text-muted); }
</style>
</head>

function parseSetString(raw, prevWeight) {
  raw = raw.trim();
  if (!raw) return null;

  if (/^(Knee down|Dynamic|Prone|off|back off|Hold|Floor bridge|Staggered|Assisted|Inverted|ss |Tried|Plate ss|Rod$|Single$|Mix$|Wide$|Supine$|Close$|Hammer$|Goblet$|Smith$|DB$|Seated$|Standing$|Incline$|Alt$|Double$|Legs\+|Rev$|-$)/i.test(raw)) return null;

  if (/^(m-|x\d|session|\(session)/.test(raw)) return null;

    const parts = raw.split('->');
    raw = parts[parts.length - 1].trim();
  }

  // Prefix stripping: "Cable: 25-10", "Paused: 45-15", "Inc: empty", "Flat: empty", etc.
  raw = raw.replace(/^[A-Za-z][A-Za-z0-9 ]*:\s*/,'');

  // "empty" = warmup, no weight
  if (/^empty$/i.test(raw)) return { weight: 0, reps: 0, warmup: true, drop: false, pain: 0 };

  let warmup = false, drop = false, pain = 0;

  if (/\bwu\b/i.test(raw)) warmup = true;
  // Check drop
  if (/\bdrop\b/i.test(raw)) drop = true;

  const painMatch = raw.match(/(\d+)\/10/);
  if (painMatch) pain = parseInt(painMatch[1],10);

  // Strip parenthetical annotations for numeric extraction
  let clean = raw.replace(/\([^)]*\)/g, '').trim();

  // "Wx3" shorthand: weight x N sets
  const wxn = clean.match(/^(\d+\.?\d*)s?\s*x\s*(\d+)$/i);
  if (wxn) {
    return { weight: parseFloat(wxn[1]), reps: 0, warmup, drop, pain, shorthand: parseInt(wxn[2],10) };

  if (wuMatch) {

  }

  const bwMatch = clean.match(/^bw-(\d+)/i);
  if (bwMatch) {

  const stdMatch = clean.match(/^(\d+\.?\d*)s?-(\d+)/);

  let prevWeight = null;
  for (const p of parts) {
    const s = parseSetString(p, prevWeight);
    if (s) {
      if (s.weight > 0) prevWeight = s.weight;
      if (s.shorthand) {
        const n = s.shorthand;
        delete s.shorthand;
        for (let i = 0; i < n; i++) sets.push({ ...s });
      } else {
        sets.push(s);
      }
    }
  }
  if (sets.length === 0 && trimmed.length > 0) {
    return [{ weight: 0, reps: 0, warmup: false, drop: false, pain: 0, textOnly: true, rawText: trimmed }];
  }
  return sets;
}

function estimateE1RM(weight, reps) {
  if (!weight || weight <= 0) return 0;
  if (!reps || reps <= 0) return weight; // weight-only = conservative floor
  if (reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}

function computeSessionMetrics(sets) {
  const working = sets.filter(s => !s.warmup && !s.textOnly);
  let maxWeight = 0, totalVolume = 0, bestE1RM = 0;
  const repBuckets = { low: 0, mid: 0, high: 0 };
  for (const s of working) {
    if (s.weight > maxWeight) maxWeight = s.weight;
    if (s.weight > 0 && s.reps > 0) totalVolume += s.weight * s.reps;
    const e = estimateE1RM(s.weight, s.reps);
    if (e > bestE1RM) bestE1RM = e;
    if (s.reps > 0) {
      if (s.reps < 8) repBuckets.low++;
      else if (s.reps <= 12) repBuckets.mid++;
      else repBuckets.high++;
    }
  }
  const painScores = sets.filter(s => s.pain > 0).map(s => s.pain);
  return { maxWeight, totalVolume, bestE1RM, repBuckets, maxPain: painScores.length ? Math.max(...painScores) : 0 };
}

// ============================================================
// TRAINING CONTEXT EXTRACTION (Coach-level note parsing)
// ============================================================
function extractTrainingContext(notes, setsRaw) {
  const combined = (notes + ' ' + setsRaw).toLowerCase();
  const ctx = { angle: null, dominance: null, stance: null, tempo: null, painArea: null, formCues: [] };

  // Angle/degree extraction (incline bench angles, OHP seat angles, etc.)
  const degMatch = combined.match(/(\d+)\s*(?:deg|degree)/);
  if (degMatch) ctx.angle = parseInt(degMatch[1], 10);
  // Notes often just say "15 degrees", "30 degrees", "45 degrees", "75 degrees", "90 degrees"
  const degNotesMatch = notes.match(/\b(15|30|45|60|75|90)\s*degrees?\b/i);
  if (degNotesMatch) ctx.angle = parseInt(degNotesMatch[1], 10);
  // Also extract from raw shorthand like "15:" or "30:" at start of notes
  if (!ctx.angle) {
    const shortAngle = notes.match(/^(15|30|45|60|75|90)\b/);
    if (shortAngle) ctx.angle = parseInt(shortAngle[1], 10);
  }
  // "low incline" ~ 15-30, "flat" ~ 0
  if (!ctx.angle && /\bflat\b/i.test(notes)) ctx.angle = 0;
  if (!ctx.angle && /\blow\s*inc/i.test(notes)) ctx.angle = 15;

  // Dominance - which muscle was targeted as primary mover
  if (/chest\s*dom/i.test(combined)) ctx.dominance = 'Chest';
  else if (/delt\s*dom/i.test(combined) || /shoulder\s*dom/i.test(combined)) ctx.dominance = 'Delt';
  else if (/back\s*dom/i.test(combined)) ctx.dominance = 'Back';
  else if (/\bmix/i.test(combined)) ctx.dominance = 'Mixed';

  // Stance/position (squats, lunges)
  if (/\bstanding\b/i.test(notes)) ctx.stance = 'Standing';
  else if (/\bseated\b/i.test(notes)) ctx.stance = 'Seated';
  else if (/\bsingle\b/i.test(notes)) ctx.stance = 'Single Arm';

  // Tempo cues
  if (/\bpaused\b/i.test(combined)) ctx.tempo = 'Paused';
  else if (/\bslow\b/i.test(combined)) ctx.tempo = 'Slow';
  else if (/\btempo\b/i.test(combined)) ctx.tempo = 'Tempo';

  // Pain area extraction
  if (/l\s*delt/i.test(combined) && /pain|pinch|discomf|hurt/i.test(combined)) ctx.painArea = 'L Delt';
  else if (/l\s*wrist/i.test(combined) && /pain|pinch|discomf|incr/i.test(combined)) ctx.painArea = 'L Wrist';
  else if (/l\s*knee|r\s*knee/i.test(combined) && /pain|pinch|discomf/i.test(combined)) ctx.painArea = 'Knee';
  else if (/low\s*back|lumbar|lb\s*pump/i.test(combined)) ctx.painArea = 'Low Back';
  else if (/ham/i.test(combined) && /pain|sens|pull|episode/i.test(combined)) ctx.painArea = 'Hamstring';

  // Key form cues (what the coach was working on)
  if (/hard\s*cue/i.test(combined)) ctx.formCues.push('Hard cue');
  if (/\barch\b/i.test(combined)) ctx.formCues.push('Arch');
  if (/elbow/i.test(combined)) ctx.formCues.push('Elbow position');
  if (/range\s*drop|lr\b|low\s*range/i.test(combined)) ctx.formCues.push('Range issue');
  if (/\brehab\b/i.test(combined)) ctx.formCues.push('Rehab');

  return ctx;
}

function parseFile(content) {
  const exercises = [];
  // Split on ## headers
  const sections = content.split(/\n## /);
  for (let i = 1; i < sections.length; i++) {
    const sec = sections[i];
    const nameEnd = sec.indexOf('\n');
    const name = sec.substring(0, nameEnd).trim();
    // Find table rows
    const lines = sec.split('\n');
    let hasVariantCol = false;
    // Check header row for 4-column variant
    for (const line of lines) {
      if (/^\|.*\|.*Variant|Grip|Attachment.*\|/i.test(line)) { hasVariantCol = true; break; }
      // Also detect by header cell count
      if (/^\|\s*Date\s*\|/.test(line)) {
        const cells = line.split('|').filter(c => c.trim());
        if (cells.length >= 4) hasVariantCol = true;
        break;
      }
    }
    const sessions = [];
    for (const line of lines) {
      if (!line.startsWith('|')) continue;
      if (/^\|[\s-]+\|/.test(line)) continue; // separator
      if (/^\|\s*Date\s*\|/.test(line)) continue; // header
      const cells = line.split('|').filter(c => c.trim()).map(c => c.trim());
      if (cells.length < 2) continue;
      const date = parseDate(cells[0]);
      if (!date) continue;
      const setsRaw = cells[1];
      let variant = '';
      let notes = '';
      if (hasVariantCol && cells.length >= 4) {
        variant = cells[2] || '';
        notes = cells[3] || '';
      } else if (hasVariantCol && cells.length === 3) {
        variant = cells[2] || '';
      } else {
        notes = cells[cells.length > 2 ? 2 : -1] || '';
        if (cells.length > 2) notes = cells[2];
      }
      if (variant === '-') variant = '';
      const sets = parseSetsCell(setsRaw);
      const metrics = computeSessionMetrics(sets);
      const context = extractTrainingContext(notes, setsRaw);
      sessions.push({ date, setsRaw, sets, variant, notes, ...metrics, context });
    }
    sessions.sort((a,b) => a.date - b.date);
    exercises.push({ name, sessions, hasVariantCol });
  }
  return exercises;
}

// ============================================================
// VARIANT SPLITTING - exercises where variants are fundamentally different movements
// ============================================================
// Key: exercise name (lowercase). Value: object mapping variant substrings to split group names.
// Sessions whose variant matches a key get split into a separate exercise entry.
const SPLIT_RULES = {
  'tricep pushdown': {
    groups: {
      'Rod': ['Rod', 'rod'],
      'Rope': ['Rope', 'rope', '2 ropes', 'New longer rope'],
      'Single': ['Single', 'single'],
      'V-Grip': ['V', 'v']
    },
    fallbackGroup: 'Rod'
  },
  'cable curls': {
    groups: {
      'Rod': ['Rod', 'rod'],
      'Rope': ['Rope', 'rope'],
      'Reverse': ['Rev', 'rev'],
      'D-Handle': ['D-handle', 'd-handle']
    },
    fallbackGroup: 'Rod'
  },
  'cable close grip pulldown': {
    groups: {
      'Bilateral': ['Ds', 'Supine', 'Hammer', 'supine', 'hammer', 'close'],
      'Single Arm': ['Single', 'single']
    },
    fallbackGroup: 'Bilateral'
  },
  'seated machine row': {
    groups: {
      'Bilateral': ['Close', 'Wide', 'close', 'wide', 'Lat pulldown'],
      'Single Arm': ['Single', 'single']
    },
    fallbackGroup: 'Bilateral'
  },
  'shrugs': {
    groups: {
      'DB': ['DB', 'db'],
      'Cable': ['Cable', 'cable', 'Behind']
    },
    fallbackGroup: 'DB'
  },
  'chest fly': {
    groups: {
      'Machine': ['Machine', 'machine'],
      'Cable': ['Cable', 'cable', 'Bottom to top', 'Bent-over'],
      'DB': ['DB', 'db']
    },
    fallbackGroup: 'Machine'
  },
  'front raises': {
    groups: {
      'Plate': ['Plate', 'plate'],
      'Cable': ['Rope', 'rope', 'cable']
    },
    fallbackGroup: 'DB'
  },
  'calf raises': {
    groups: {
      'Smith': ['Smith', 'smith'],
      'Machine': ['Leg press', 'leg press', 'Straight leg', 'seated']
    },
    fallbackGroup: 'Smith'
  }
};

function classifyVariant(exerciseName, variant, setsRaw, notes) {
  const lowerName = exerciseName.toLowerCase();
  const rule = Object.entries(SPLIT_RULES).find(([key]) => lowerName.includes(key));
  if (!rule) return null;
  const [, config] = rule;
  const combined = (variant + ' ' + setsRaw + ' ' + notes);
  for (const [groupName, matchers] of Object.entries(config.groups)) {
    for (const m of matchers) {
      if (m && combined.includes(m)) return groupName;
    }
  }
  return config.fallbackGroup;
}

function splitExercisesByVariant(exercises) {
  const result = [];
  for (const ex of exercises) {
    const lowerName = ex.name.toLowerCase();
    const needsSplit = Object.keys(SPLIT_RULES).some(key => lowerName.includes(key));
    if (!needsSplit || ex.sessions.length === 0) {
      result.push(ex);
      continue;
    }
    // Group sessions by their split classification
    const groups = {};
    for (const s of ex.sessions) {
      const cls = classifyVariant(ex.name, s.variant, s.setsRaw, s.notes) || 'Other';
      if (!groups[cls]) groups[cls] = [];
      groups[cls].push(s);
    }
    // Only split if we actually have multiple groups with data
    const validGroups = Object.entries(groups).filter(([, sess]) => sess.length > 0);
    if (validGroups.length <= 1) {
      result.push(ex);
      continue;
    }
    for (const [groupName, sessions] of validGroups) {
      sessions.sort((a, b) => a.date - b.date);
      result.push({
        name: `${ex.name} (${groupName})`,
        sessions,
        hasVariantCol: ex.hasVariantCol,
        parentName: ex.name,
        splitGroup: groupName
      });
    }
  }
  return result;
}

// ============================================================
// PARSE ALL DATA
// ============================================================
const DATA = {};
let allDates = [];
let totalExercises = 0;
const uniqueDateSet = new Set();

for (const [group, content] of Object.entries(RAW_FILES)) {
  const parsed = parseFile(content);
  DATA[group] = splitExercisesByVariant(parsed);
  for (const ex of DATA[group]) {
    totalExercises++;
    for (const s of ex.sessions) {
      allDates.push(s.date);
      // A session = one unique training day (YYYY-MM-DD)
      uniqueDateSet.add(s.date.toISOString().slice(0, 10));
    }
  }
}
const totalSessions = uniqueDateSet.size;
allDates.sort((a,b) => a - b);
const firstDate = allDates[0];
const lastDate = allDates[allDates.length - 1];

// Compute avg sessions per week
const totalWeeks = firstDate && lastDate ? daysBetween(firstDate, lastDate) / 7 : 1;
const avgPerWeek = (totalSessions / totalWeeks).toFixed(1);

// ============================================================
// EXERCISE ANALYSIS (PR detection, progressive overload, trends)
// ============================================================
function analyzeExercise(ex) {
  let allTimePR = 0, prDate = null, allTimeE1RM = 0, e1rmDate = null;

  let runningMaxWeight = 0, runningMaxE1RM = 0;
  for (let i = 0; i < ex.sessions.length; i++) {
    const s = ex.sessions[i];
    if (s.maxWeight > runningMaxWeight) {
      runningMaxWeight = s.maxWeight;
      s.isWeightPR = true;
    }
    if (s.bestE1RM > runningMaxE1RM) {
      runningMaxE1RM = s.bestE1RM;
      s.isE1RMPR = true;
    }
  }

  allTimePR = runningMaxWeight;
  allTimeE1RM = runningMaxE1RM;
  for (const s of ex.sessions) {
    if (s.maxWeight === allTimePR && !prDate) prDate = s.date;
    if (s.bestE1RM === allTimeE1RM && !e1rmDate) e1rmDate = s.date;
  }

  // Plateau detection: sessions since last e1RM PR
  const validSessions = ex.sessions.filter(s => s.bestE1RM > 0);
  let lastPRIdx = -1;
  for (let i = validSessions.length - 1; i >= 0; i--) {
    if (validSessions[i].isE1RMPR) { lastPRIdx = i; break; }
  }
  const sessionsSincePR = lastPRIdx >= 0 ? validSessions.length - 1 - lastPRIdx : validSessions.length;

  // Trend: compare avg e1RM of last 4 sessions to prior 4
  let trend = 'neutral';
  if (validSessions.length >= 8) {
    const recent4 = validSessions.slice(-4).reduce((a,s) => a + s.bestE1RM, 0) / 4;
    const prior4 = validSessions.slice(-8, -4).reduce((a,s) => a + s.bestE1RM, 0) / 4;
    if (recent4 > prior4 * 1.03) trend = 'up';
    else if (recent4 < prior4 * 0.97) trend = 'down';
  } else if (validSessions.length >= 4) {
    const half = Math.floor(validSessions.length / 2);
    const recent = validSessions.slice(half).reduce((a,s) => a + s.bestE1RM, 0) / (validSessions.length - half);
    const older = validSessions.slice(0, half).reduce((a,s) => a + s.bestE1RM, 0) / half;
    if (recent > older * 1.03) trend = 'up';
    else if (recent < older * 0.97) trend = 'down';
  }

  // Status label
  let status, statusColor;
  if (sessionsSincePR <= 3) { status = 'Progressing'; statusColor = '#22c55e'; }
  else if (sessionsSincePR <= 6) { status = 'Maintaining'; statusColor = '#eab308'; }
  else if (sessionsSincePR <= 10) { status = 'Plateaued'; statusColor = '#f97316'; }
  else { status = 'Stalled'; statusColor = '#ef4444'; }

  // Last session info
  const lastSession = ex.sessions[ex.sessions.length - 1];
  const daysSinceLast = lastSession ? Math.round((new Date() - lastSession.date) / 86400000) : null;
  // Current working max (max of last 3 sessions)
  const last3 = validSessions.slice(-3);
  const currentMax = last3.length ? Math.max(...last3.map(s => s.maxWeight)) : 0;

  ex.analysis = {
    allTimePR, prDate, allTimeE1RM, e1rmDate,
    sessionsSincePR, trend, status, statusColor,
    daysSinceLast, currentMax,
    totalValidSessions: validSessions.length
  };
}

// Run analysis on all exercises
for (const group of Object.values(DATA)) {
  for (const ex of group) analyzeExercise(ex);
}

function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function fmt(d) { if (!d) return ''; return d.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}); }
function daysBetween(a,b) { return Math.round((b-a)/(86400000)); }

function getCurrentMeso() {
  const now = new Date();
  for (const m of MESOCYCLES) {
    if (now >= new Date(m.start) && now <= new Date(m.end)) return m.name;
  }
  return MESOCYCLES[MESOCYCLES.length-1].name;
}

// ============================================================
// SPARKLINE DRAWING
// ============================================================
function drawSparkline(canvas, data, color) {
  if (!canvas || !data || data.length < 2) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const dw = canvas.offsetWidth, dh = canvas.offsetHeight;
  const vals = data.filter(v => v > 0);
  if (vals.length < 2) return;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < vals.length; i++) {
    const x = (i / (vals.length - 1)) * dw;
    const y = dh - ((vals[i] - min) / range) * (dh - 4) - 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

}

function setActiveNav(view) {

}

function route() {
  destroyChart();

  if (parts[0] === 'dashboard' || !parts[0]) {

}

// ============================================================
// TRAINING HEATMAP
// ============================================================
function drawHeatmap(canvas) {
  // Compute per-date exercise counts
  const dateCounts = {};
  for (const group of Object.values(DATA)) {
    for (const ex of group) {
      for (const s of ex.sessions) {
        const key = s.date.toISOString().slice(0,10);
        dateCounts[key] = (dateCounts[key] || 0) + 1;
      }
    }
  }

  if (!firstDate || !lastDate) return;

  const cellSize = 12, gap = 2, step = cellSize + gap;
  const dayLabels = ['', 'Mon', '', 'Wed', '', 'Fri', ''];
  const labelWidth = 30;

  // Align to start of week (Sunday)
  const start = new Date(firstDate);
  start.setDate(start.getDate() - start.getDay());
  const end = new Date(lastDate);
  end.setDate(end.getDate() + (6 - end.getDay()));

  const totalDays = Math.round((end - start) / 86400000) + 1;
  const totalWeeks = Math.ceil(totalDays / 7);

  const headerHeight = 20;
  const width = labelWidth + totalWeeks * step + 10;
  const height = headerHeight + 7 * step + 10;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // Day labels
  ctx.fillStyle = '#5a5a78';
  ctx.font = '10px Inter, sans-serif';
  ctx.textBaseline = 'middle';
  for (let d = 0; d < 7; d++) {
    if (dayLabels[d]) {
      ctx.fillText(dayLabels[d], 0, headerHeight + d * step + cellSize / 2);
    }
  }

  // Month labels
  let lastMonth = -1;
  const cursor = new Date(start);
  for (let w = 0; w < totalWeeks; w++) {
    const weekStart = new Date(start.getTime() + w * 7 * 86400000);
    const month = weekStart.getMonth();
    if (month !== lastMonth) {
      lastMonth = month;
      const monthName = weekStart.toLocaleString('en-US', { month: 'short' });
      ctx.fillStyle = '#5a5a78';
      ctx.font = '10px Inter, sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(monthName, labelWidth + w * step, 2);
    }
  }

  // Draw cells
  for (let w = 0; w < totalWeeks; w++) {
    for (let d = 0; d < 7; d++) {
      const dayDate = new Date(start.getTime() + (w * 7 + d) * 86400000);
      const key = dayDate.toISOString().slice(0,10);
      const count = dateCounts[key] || 0;

      let color;
      if (count === 0) color = '#1a1a2e';
      else if (count <= 2) color = '#1a4731';
      else if (count <= 4) color = 'rgba(34,197,94,0.53)';
      else color = '#22c55e';

      const x = labelWidth + w * step;
      const y = headerHeight + d * step;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, cellSize, cellSize, 2);
      ctx.fill();
    }
  }
}

  const spanYrs = (spanDays / 365).toFixed(1);

  let html = `<h1>Strength Training Tracker</h1>
  <div class="subtitle">Tracking ${spanYrs} years of progression across ${totalExercises} exercises</div>
  <div class="stats-row">
    <div class="stat-card"><div class="label">Training Days</div><div class="value">${totalSessions}</div><div class="detail">${avgPerWeek}/week avg</div></div>
    <div class="stat-card"><div class="label">Training Span</div><div class="value">${spanYrs}y</div><div class="detail">${span}</div></div>
    <div class="stat-card"><div class="label">Exercises</div><div class="value">${totalExercises}</div></div>
    <div class="stat-card"><div class="label">Current Meso</div><div class="value">${getCurrentMeso()}</div></div>
  </div>
  <div class="section-title">Muscle Groups</div>

  for (const [key, meta] of Object.entries(GROUP_META)) {

    let topEx = '', topWeight = 0;

    }
    html += `<div class="card" onclick="location.hash='${key}'">
      <div class="accent-bar" style="background:${meta.accent}"></div>

      <div class="card-meta">${exercises.length} exercises</div>
      ${topEx ? `<div class="card-meta">Top: <strong>${topEx}</strong> @ <strong>${topWeight} lbs</strong></div>` : ''}
    </div>`;
  }
  html += `</div>`;

  // Mesocycle timeline
  const totalMesoDays = daysBetween(new Date(MESOCYCLES[0].start), new Date(MESOCYCLES[MESOCYCLES.length-1].end));
  html += `<div class="section-title">Mesocycle Timeline</div><div class="meso-timeline">`;
  for (const m of MESOCYCLES) {
    const days = daysBetween(new Date(m.start), new Date(m.end));
    const pct = Math.max(5, (days / totalMesoDays) * 100);
    html += `<div class="meso-bar" style="background:${m.color};flex:${pct};" title="${m.name}: ${m.start} to ${m.end}">${m.name}</div>`;
  }
  html += `</div>`;

  // Training Activity Heatmap
  html += `<div class="section-title">Training Activity</div>
  <div class="heatmap-scroll"><canvas id="heatmapCanvas"></canvas></div>`;

  // Bodyweight chart
  html += `<div class="section-title">Bodyweight</div>
  <div class="bw-chart-wrap chart-wrap"><canvas id="bwChart"></canvas></div>`;

  main.innerHTML = html;

  // Draw heatmap
  requestAnimationFrame(() => {
    const heatCanvas = document.getElementById('heatmapCanvas');
    if (heatCanvas) drawHeatmap(heatCanvas);
  });

  // Draw bodyweight chart
  requestAnimationFrame(() => {
    const ctx = document.getElementById('bwChart');
    if (!ctx) return;
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: BODYWEIGHT.map(b => b.date),
        datasets: [{
          label: 'Bodyweight (kg)',
          data: BODYWEIGHT.map(b => b.kg),
          borderColor: '#60a5fa',
          backgroundColor: 'rgba(96,165,250,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 5,
          pointBackgroundColor: '#60a5fa'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { type: 'time', time: { unit: 'month' }, grid: { display: false } },
          y: { beginAtZero: false, grid: { color: 'rgba(255,255,255,0.06)' } }
        }
      }
    });
  });
}

// ============================================================
// GROUP VIEW
// ============================================================
function renderGroup(group) {
  const main = document.getElementById('main');
  const meta = GROUP_META[group];
  const exercises = DATA[group] || [];

  let html = `<div class="breadcrumb"><a onclick="location.hash='dashboard'">Dashboard</a><span class="sep">&gt;</span>${meta.label}</div>
  <h1 style="color:${meta.accent}">${meta.label}</h1>
  <div class="subtitle">${exercises.length} exercises tracked</div>
  <div class="card-grid">`;

  for (const ex of exercises) {
    const count = ex.sessions.length;
    let maxW = 0;
    const sparkData = [];
    for (const s of ex.sessions) {
      if (s.maxWeight > maxW) maxW = s.maxWeight;
      if (s.maxWeight > 0) sparkData.push(s.maxWeight);
    }
    const slug = slugify(ex.name);
    const statusHtml = ex.analysis ?
      `<span class="status-badge" style="background:${ex.analysis.statusColor}22;color:${ex.analysis.statusColor}">${ex.analysis.status}</span>` : '';
    html += `<div class="card" onclick="location.hash='${group}/${slug}'">
      <div class="accent-bar" style="background:${meta.accent}"></div>
      <div class="card-title">${ex.name}</div>
      <div class="card-meta">${count} sessions | Max: <strong>${maxW > 0 ? maxW + ' lbs' : 'BW'}</strong>${statusHtml}</div>
      <div class="sparkline-wrap"><canvas class="sparkline" data-color="${meta.accent}" data-values="${sparkData.join(',')}" style="width:100%;height:30px;"></canvas></div>
    </div>`;
  }
  html += `</div>`;
  main.innerHTML = html;

  // Draw sparklines
  requestAnimationFrame(() => {
    main.querySelectorAll('.sparkline').forEach(c => {
      const vals = c.dataset.values.split(',').filter(v=>v).map(Number);
      drawSparkline(c, vals, c.dataset.color);
    });
  });
}

// ============================================================
// EXERCISE DETAIL VIEW
// ============================================================
function renderExercise(group, slug) {
  const main = document.getElementById('main');
  const meta = GROUP_META[group];
  const exercises = DATA[group] || [];
  const ex = exercises.find(e => slugify(e.name) === slug);
  if (!ex) { main.innerHTML = '<p>Exercise not found.</p>'; return; }

  // Build filter options from training context
  const variants = [...new Set(ex.sessions.map(s => s.variant).filter(v => v))];
  const angles = [...new Set(ex.sessions.map(s => s.context.angle).filter(a => a !== null))].sort((a,b)=>a-b);
  const dominances = [...new Set(ex.sessions.map(s => s.context.dominance).filter(d => d))];
  const painAreas = [...new Set(ex.sessions.map(s => s.context.painArea).filter(p => p))];
  const hasFilters = variants.length > 0 || angles.length > 1 || dominances.length > 1;

  const a = ex.analysis || {};
  let html = `<div class="breadcrumb">
    <a onclick="location.hash='dashboard'">Dashboard</a><span class="sep">&gt;</span>
    <a onclick="location.hash='${group}'">${meta.label}</a><span class="sep">&gt;</span>${ex.name}</div>
  <h1>${ex.name}</h1>
  <div class="subtitle">${ex.sessions.length} sessions | ${meta.label}</div>
  <div class="exercise-stats">
    <div class="ex-stat">
      <div class="ex-stat-label">All-Time e1RM</div>
      <div class="ex-stat-value pr-gold">${a.allTimeE1RM > 0 ? a.allTimeE1RM + ' lbs' : '-'}</div>
      <div class="ex-stat-detail">${a.e1rmDate ? fmt(a.e1rmDate) : ''}</div>
    </div>
    <div class="ex-stat">
      <div class="ex-stat-label">Max Weight Lifted</div>
      <div class="ex-stat-value">${a.allTimePR > 0 ? a.allTimePR + ' lbs' : 'BW'}</div>
      <div class="ex-stat-detail">${a.prDate ? fmt(a.prDate) : ''}</div>
    </div>
    <div class="ex-stat">
      <div class="ex-stat-label">Current Working Max</div>
      <div class="ex-stat-value">${a.currentMax > 0 ? a.currentMax + ' lbs' : '-'}</div>
      <div class="ex-stat-detail">Last 3 sessions</div>
    </div>
    <div class="ex-stat">
      <div class="ex-stat-label">Status</div>
      <div class="ex-stat-value" style="color:${a.statusColor || 'inherit'}">${a.status || '-'}</div>
      <div class="ex-stat-detail">${a.sessionsSincePR > 0 ? a.sessionsSincePR + ' sessions since PR' : 'Recent PR!'}</div>
    </div>
    <div class="ex-stat">
      <div class="ex-stat-label">Last Trained</div>
      <div class="ex-stat-value">${a.daysSinceLast !== null && a.daysSinceLast !== undefined ? a.daysSinceLast + 'd ago' : '-'}</div>
      <div class="ex-stat-detail">${a.totalValidSessions || 0} sessions w/ data</div>
    </div>
  </div>`;

  if (hasFilters) {
    html += `<div class="filter-row">`;
    if (variants.length > 0) {
      html += `<label>Variant:</label><select id="variantFilter" class="ctx-filter">
        <option value="">All</option>${variants.map(v => `<option value="${v}">${v}</option>`).join('')}</select>`;
    }
    if (angles.length > 1) {
      html += `<label>Angle:</label><select id="angleFilter" class="ctx-filter">
        <option value="">All angles</option>${angles.map(a => `<option value="${a}">${a === 0 ? 'Flat (0°)' : a + '°'}</option>`).join('')}</select>`;
    }
    if (dominances.length > 1) {
      html += `<label>Emphasis:</label><select id="domFilter" class="ctx-filter">
        <option value="">All</option>${dominances.map(d => `<option value="${d}">${d} dominant</option>`).join('')}</select>`;
    }
    html += `</div>`;
  }

  html += `<div class="tab-bar">
    <button class="tab-btn active" data-tab="maxweight">Max Weight</button>
    <button class="tab-btn" data-tab="volume">Volume</button>
    <button class="tab-btn" data-tab="repranges">Rep Ranges</button>
    <button class="tab-btn" data-tab="recent">Recent Sessions</button>
  </div>
  <div class="chart-wrap"><canvas id="exerciseChart"></canvas></div>`;

  // Context legend for pain/injury annotations
  if (painAreas.length > 0) {
    html += `<div class="context-legend"><span class="pain-dot"></span> Pain reported in sessions: ${painAreas.join(', ')}</div>`;
  }

  // Session table with context columns
  html += `<div class="section-title">Session History</div>
  <div id="sessionTableWrap" style="overflow-x:auto;"></div>`;
  main.innerHTML = html;

  let currentTab = 'maxweight';

  function getFilteredSessions() {
    let result = ex.sessions;
    const varSel = document.getElementById('variantFilter');
    if (varSel && varSel.value) result = result.filter(s => s.variant === varSel.value);
    const angSel = document.getElementById('angleFilter');
    if (angSel && angSel.value) result = result.filter(s => s.context.angle === parseInt(angSel.value, 10));
    const domSel = document.getElementById('domFilter');
    if (domSel && domSel.value) result = result.filter(s => s.context.dominance === domSel.value);
    return result;
  }

  function renderSessionTable() {
    const filtered = getFilteredSessions();
    const reversed = [...filtered].reverse();
    const showVariant = variants.length > 0;
    const showAngle = angles.length > 1;
    let thtml = `<table class="data-table">
      <tr><th>Date</th><th>Sets</th>${showVariant ? '<th>Variant</th>':''}${showAngle ? '<th>Angle</th>':''}
      <th>Emphasis</th><th>Max Wt</th><th>Volume</th><th>Context</th></tr>`;
    for (const s of reversed) {
      const allTextOnly = s.sets.length > 0 && s.sets.every(st => st.textOnly);
      const painBadge = s.maxPain > 0 ? `<span class="pain-badge">${s.maxPain}/10</span>` : '';
      const domBadge = s.context.dominance ? `<span class="dom-badge dom-${s.context.dominance.toLowerCase()}">${s.context.dominance}</span>` : '<span style="color:var(--text-muted)">-</span>';
      const angleTxt = s.context.angle !== null ? (s.context.angle === 0 ? 'Flat' : s.context.angle + '°') : '';
      const cues = [];
      if (s.context.tempo) cues.push(s.context.tempo);
      if (s.context.formCues.length) cues.push(...s.context.formCues);
      if (s.context.painArea) cues.push('⚠ ' + s.context.painArea);
      const cueStr = cues.join(', ');
      if (allTextOnly) {
        const rawText = s.sets.map(st => st.rawText).join(', ');
        thtml += `<tr>
          <td style="white-space:nowrap;">${fmt(s.date)}</td>
          <td colspan="${2 + (showVariant?1:0) + (showAngle?1:0)}" style="font-style:italic;color:var(--text-muted);">${rawText} <span style="font-size:11px;opacity:0.6">(no numeric data)</span></td>
          <td>-</td>
          <td>-</td>
          <td style="font-size:12px;color:var(--text-secondary);">${cueStr || (s.notes ? s.notes.substring(0,60) : '')}</td>
        </tr>`;
      } else {
        thtml += `<tr>
          <td style="white-space:nowrap;">${fmt(s.date)}</td>
          <td>${s.setsRaw}</td>
          ${showVariant ? `<td>${s.variant||'-'}</td>`:''}
          ${showAngle ? `<td>${angleTxt||'-'}</td>`:''}
          <td>${domBadge}</td>
          <td>${s.maxWeight > 0 ? s.maxWeight + painBadge : '-'}</td>
          <td>${s.totalVolume > 0 ? s.totalVolume.toLocaleString() : '-'}</td>
          <td style="font-size:12px;color:var(--text-secondary);">${cueStr || (s.notes ? s.notes.substring(0,60) : '')}</td>
        </tr>`;
      }
    }
    thtml += `</table>`;
    const wrap = document.getElementById('sessionTableWrap');
    if (wrap) wrap.innerHTML = thtml;
  }

  function drawTab(tab) {
    currentTab = tab;
    destroyChart();
    const canvas = document.getElementById('exerciseChart');
    if (!canvas) return;
    const sessions = getFilteredSessions();

    if (tab === 'maxweight') {
      const data = sessions.filter(s => s.maxWeight > 0 || s.bestE1RM > 0);
      const e1rmData = data.filter(s => s.bestE1RM > 0);
      const weightData = data.filter(s => s.maxWeight > 0);
      const painData = data.filter(s => s.maxPain > 0);
      const prData = data.filter(s => s.isE1RMPR && s.bestE1RM > 0);

      const datasets = [];

      if (e1rmData.length > 0) {
        datasets.push({
          label: 'Estimated 1RM',
          data: e1rmData.map(s => ({ x: s.date, y: s.bestE1RM })),
          borderColor: meta.accent,
          backgroundColor: meta.accent + '22',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: meta.accent,
          borderWidth: 2
        });
      }

      datasets.push({
        label: 'Max Weight Lifted',
        data: weightData.map(s => ({ x: s.date, y: s.maxWeight })),
        borderColor: meta.accent + '88',
        backgroundColor: 'transparent',
        borderDash: [5, 3],
        tension: 0.3,
        pointRadius: 2,
        pointBackgroundColor: meta.accent + '88',
        borderWidth: 1.5
      });

      // PR markers (gold stars)
      if (prData.length > 0) {
        datasets.push({
          label: 'PR',
          data: prData.map(s => ({ x: s.date, y: s.bestE1RM })),
          borderColor: 'transparent',
          backgroundColor: '#fbbf24',
          pointRadius: 7,
          pointStyle: 'star',
          showLine: false
        });
      }

      // Pain markers
      if (painData.length > 0) {
        datasets.push({
          label: 'Pain Reported',
          data: painData.map(s => ({ x: s.date, y: s.maxWeight || s.bestE1RM })),
          borderColor: 'transparent',
          backgroundColor: '#ef4444',
          pointRadius: 6,
          pointStyle: 'crossRot',
          showLine: false
        });
      }

      const mesoAnnotations = MESOCYCLES.reduce((acc, m, i) => {
        acc['meso' + i] = {
          type: 'box',
          xMin: new Date(m.start).getTime(),
          xMax: new Date(m.end).getTime(),
          backgroundColor: m.color + '0a',
          borderWidth: 0,
          label: {
            content: m.name,
            display: true,
            position: 'start',
            color: m.color + '66',
            font: { size: 10 }
          }
        };
        return acc;
      }, {});

      currentChart = new Chart(canvas, {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { display: datasets.length > 1 },
            annotation: { annotations: mesoAnnotations }
          },
          scales: {
            x: { type: 'time', time: { unit: 'month' }, grid: { display: false } },
            y: { beginAtZero: false, title: { display: true, text: 'lbs' }, grid: { color: 'rgba(255,255,255,0.06)' } }
          }
        }
      });
    } else if (tab === 'volume') {
      const data = sessions.filter(s => s.totalVolume > 0);
      currentChart = new Chart(canvas, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Total Volume (lbs)',
            data: data.map(s => ({ x: s.date, y: s.totalVolume })),
            borderColor: '#a78bfa',
            backgroundColor: 'rgba(167,139,250,0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#a78bfa'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            annotation: {
              annotations: MESOCYCLES.reduce((acc, m, i) => {
                acc['meso' + i] = {
                  type: 'box',
                  xMin: new Date(m.start).getTime(),
                  xMax: new Date(m.end).getTime(),
                  backgroundColor: m.color + '0a',
                  borderWidth: 0,
                  label: { content: m.name, display: true, position: 'start', color: m.color + '66', font: { size: 10 } }
                };
                return acc;
              }, {})
            }
          },
          scales: {
            x: { type: 'time', time: { unit: 'month' }, grid: { display: false } },
            y: { beginAtZero: false, title: { display: true, text: 'Volume (lbs)' }, grid: { color: 'rgba(255,255,255,0.06)' } }
          }
        }
      });
    } else if (tab === 'repranges') {
      let low = 0, mid = 0, high = 0;
      for (const s of sessions) { low += s.repBuckets.low; mid += s.repBuckets.mid; high += s.repBuckets.high; }
      currentChart = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: ['<8 reps (Strength)', '8-12 reps (Hypertrophy)', '12+ reps (Endurance)'],
          datasets: [{ data: [low, mid, high], backgroundColor: ['#ef4444','#eab308','#22c55e'], borderWidth: 0 }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { padding: 16 } } }
        }
      });
    } else if (tab === 'recent') {
      const recent = sessions.filter(s => s.sets.length > 0).slice(-8);
      const labels = recent.map(s => fmt(s.date));
      const maxSets = Math.max(...recent.map(s => s.sets.filter(st => !st.warmup).length), 1);
      const datasets = [];
      for (let i = 0; i < maxSets; i++) {
        datasets.push({
          label: `Set ${i+1}`,
          data: recent.map(s => {
            const working = s.sets.filter(st => !st.warmup);
            return working[i] ? working[i].weight : 0;
          }),
          backgroundColor: SET_COLORS[i % SET_COLORS.length] + 'cc',
          borderRadius: 4
        });
      }
      currentChart = new Chart(canvas, {
        type: 'bar',
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            tooltip: {
              callbacks: {
                afterLabel: function(ctx) {
                  const s = recent[ctx.dataIndex];
                  const working = s.sets.filter(st => !st.warmup);
                  const set = working[ctx.datasetIndex];
                  return set && set.reps > 0 ? `${set.reps} reps` : '';
                }
              }
            }
          },
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, title: { display: true, text: 'Weight (lbs)' }, grid: { color: 'rgba(255,255,255,0.06)' } }
          }
        }
      });
    }
  }

  // Tab click handlers + filter wiring
  requestAnimationFrame(() => {
    function onFilterChange() { drawTab(currentTab); renderSessionTable(); }
    main.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        main.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        drawTab(btn.dataset.tab);
      });
    });
    // Wire up all context filters
    main.querySelectorAll('.ctx-filter').forEach(sel => {
      sel.addEventListener('change', onFilterChange);
    });
    drawTab('maxweight');
    renderSessionTable();
  });
}

// ============================================================
// INIT
// ============================================================
buildNav();
window.addEventListener('hashchange', route);
route();
</script>
</body>
